# Day-2: restrict echo to the alpha member.
# Excluded members report Pending but keep previously created runtime objects.
apiVersion: runtime.polykube.dev/v1alpha1
kind: Workload
metadata:
  name: echo
  namespace: default
spec:
  federationRef:
    name: local-dev
  image: hashicorp/http-echo:latest
  replicas: 1
  ports:
    - name: http
      containerPort: 5678
  env:
    - name: TEXT
      value: "hello from polykube"
  targetPolicy:
    members:
      - alpha
